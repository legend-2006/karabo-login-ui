<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Karabo Moeng | Login UI</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    height: 100vh;
    background: linear-gradient(135deg, #1e3c72, #2a5298);
    display: flex;
    justify-content: center;
    align-items: center;
}

/* Main Card */
.container {
    width: 320px;
    background: white;
    border-radius: 20px;
    padding: 25px;
    box-shadow: 0 15px 35px rgba(0,0,0,0.3);
    animation: fadeIn 1s ease;
}

@keyframes fadeIn {
    from {opacity: 0; transform: translateY(40px);}
    to {opacity: 1; transform: translateY(0);}
}

/* Title */
h2 {
    text-align: center;
    color: #2a5298;
    margin-bottom: 15px;
}

/* Inputs */
input {
    width: 100%;
    padding: 10px;
    margin: 8px 0;
    border-radius: 8px;
    border: 1px solid #ccc;
    transition: 0.3s;
}

input:focus {
    border-color: #2a5298;
    transform: scale(1.05);
}

/* Button */
button {
    width: 100%;
    padding: 10px;
    background: #2a5298;
    color: white;
    border: none;
    border-radius: 8px;
    margin-top: 10px;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    background: #1e3c72;
    transform: scale(1.05);
}

/* Status Message */
#status {
    text-align: center;
    margin-top: 10px;
    font-size: 12px;
}

/* Ad Banner */
.ad {
    margin-top: 15px;
    background: #f1f1f1;
    padding: 10px;
    border-radius: 8px;
    text-align: center;
    font-size: 12px;
}

/* Promo Card */
.promo {
    margin-top: 15px;
    padding: 15px;
    border-radius: 12px;
    background: linear-gradient(135deg, #2a5298, #1e3c72);
    color: white;
    text-align: center;
    animation: pop 1s ease;
}

@keyframes pop {
    from {transform: scale(0.8); opacity: 0;}
    to {transform: scale(1); opacity: 1;}
}

/* Footer */
.footer {
    margin-top: 15px;
    text-align: center;
    font-size: 11px;
    color: gray;
}
</style>
</head>

<body>

<div class="container">

    <h2>Welcome</h2>

    <input type="text" id="username" placeholder="Username">
    <input type="password" id="password" placeholder="Password">

    <button onclick="login()">Sign In</button>

    <div id="status"></div>

    <div class="ad" id="adText">
        🚀 Build Apps with Karabo Moeng
    </div>

    <div class="promo">
        <h3>🔥 Premium Access</h3>
        <p>Unlock advanced UI & remove ads</p>
        <button onclick="upgrade()">Upgrade</button>
    </div>

    <div class="footer">
        Created by Karabo Moeng
    </div>

</div>

<script>
// ===== Karabo Moeng Project =====

function login() {
    let user = document.getElementById("username").value;
    let pass = document.getElementById("password").value;

    if(user === "" || pass === "") {
        document.getElementById("status").innerHTML = "❌ Fill all fields";
        document.getElementById("status").style.color = "red";
    } else {
        document.getElementById("status").innerHTML = "✅ Login Successful";
        document.getElementById("status").style.color = "green";
    }
}

function upgrade() {
    alert("Premium feature coming soon 🚀\nBy Karabo Moeng");
}

/* Rotating Ads */
const ads = [
    "🚀 Build Apps with Karabo Moeng",
    "💡 Learn Coding Faster",
    "🔥 Upgrade Your Skills",
    "🎯 Become a Developer"
];

let i = 0;

setInterval(() => {
    document.getElementById("adText").innerText = ads[i];
    i = (i + 1) % ads.length;
}, 2000);

console.log("Project built by Karabo Moeng");
</script>

</body>
</html>
