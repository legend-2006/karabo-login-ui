<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Karabo Moeng Login UI</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #1e3c72, #2a5298);
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

/* Login Card */
.container {
    background: white;
    padding: 30px;
    border-radius: 15px;
    width: 300px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    animation: slideUp 1s ease;
}

@keyframes slideUp {
    from {
        transform: translateY(50px);
        opacity: 0;
    }
    to {
        transform: translateY(0);
        opacity: 1;
    }
}

h2 {
    text-align: center;
    color: #2a5298;
}

/* Inputs */
input {
    width: 100%;
    padding: 10px;
    margin: 10px 0;
    border-radius: 8px;
    border: 1px solid #ccc;
    transition: 0.3s;
}

input:focus {
    border-color: #2a5298;
    transform: scale(1.05);
}

/* Button */
button {
    width: 100%;
    padding: 10px;
    background: #2a5298;
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    background: #1e3c72;
    transform: scale(1.05);
}

/* Fake Ad */
.ad {
    margin-top: 15px;
    background: #f1f1f1;
    padding: 10px;
    border-radius: 8px;
    text-align: center;
    font-size: 12px;
    animation: fade 3s infinite;
}

@keyframes fade {
    0% {opacity: 1;}
    50% {opacity: 0.5;}
    100% {opacity: 1;}
}

/* Signature */
.footer {
    margin-top: 15px;
    text-align: center;
    font-size: 12px;
    color: gray;
}
</style>
</head>

<body>

<div class="container">
    <h2>Login</h2>

    <input type="text" placeholder="Username">
    <input type="password" placeholder="Password">

    <button onclick="login()">Sign In</button>

    <div class="ad" id="adText">
        🔥 Upgrade to Premium Version 🔥
    </div>

    <div class="footer">
        Created by Karabo Moeng
    </div>
</div>

<script>
// Karabo Moeng Project

function login() {
    alert("Welcome! This UI was built by Karabo Moeng");
}

// Rotating Ad Text
const ads = [
    "🔥 Upgrade to Premium 🔥",
    "💡 Learn Coding with Karabo Moeng",
    "🚀 Build Apps Faster!",
    "🎯 Become a Developer Today"
];

let index = 0;

setInterval(() => {
    document.getElementById("adText").innerText = ads[index];
    index = (index + 1) % ads.length;
}, 2000);

</script>

</body>
</html>
